    src: url('fonts/mplus-latin-900.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --accent:      #1a8c3a;
    --accent-dark: #0f4d20;
    --accent-glow: rgba(26,140,58,0.4);
    --ink:   #151515;
    --paper: #ffffff;
    --good:  #1f9d4c;
    --bad:   #e0342b;
    --thai: 'Noto Sans Thai Looped', 'Thonburi', 'Sukhumvit Set', 'Leelawadee UI', 'Noto Sans Thai', 'Loma', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: var(--accent-dark);
    color: #fff;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.4s;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    padding-top: max(8px, env(safe-area-inset-top));
    background: #0a0a0a;
    border-bottom: 2.5px solid var(--accent);
    flex-shrink: 0; z-index: 20;
    transition: border-color 0.4s;
  }
  #topbar h1 { font-size: 0.88rem; font-weight: 900; white-space: nowrap; letter-spacing: 0.04em; flex-shrink: 0; }
  .vsep { width: 1px; height: 26px; background: #333; flex-shrink: 0; }

  #level-select {
    font-family: inherit; font-size: 0.82rem; font-weight: 700;
    background: #1a1a1a; color: #fff;
    border: 2px solid var(--accent); border-radius: 8px;
    padding: 5px 10px; cursor: pointer; outline: none;
    flex: 1; max-width: 260px;
    transition: border-color 0.4s, box-shadow 0.4s;
  }
  #level-select:focus { box-shadow: 0 0 0 3px var(--accent-glow); }
  #level-select option, #level-select optgroup { background: #111; }

  /* ── TOOL BAR ── */
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: #111; border-bottom: 1.5px solid #222;
    flex-shrink: 0; z-index: 19;
  }
  .tool-btn {
    height: 36px; padding: 0 11px;
    border-radius: 9px; border: 2px solid #2a2a2a;
    background: #181818; color: #999;
    font-family: inherit; font-size: 0.8rem; font-weight: 700;
    display: flex; align-items: center; gap: 4px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: all 0.15s;
  }
  .tool-btn:hover:not(:disabled) { border-color: #555; color: #eee; background: #222; }
  .tool-btn:disabled { opacity: 0.35; cursor: default; }

  /* progress pips — one per word */
  #pips { flex: 1; display: flex; justify-content: center; gap: 6px; }
  .pip {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid #444; transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .pip.on   { background: var(--accent); border-color: var(--accent); }
  .pip.good { background: var(--good);   border-color: var(--good); }
  .pip.bad  { background: var(--bad);    border-color: var(--bad); }
  #toolbar-spacer { width: 132px; flex-shrink: 0; } /* balances the left buttons */

  /* ── STAGE (the worksheet) ── */
  #stage { flex: 1; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); }

  #placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: #f7f4ee; z-index: 5;
  }
  #placeholder .emoji { font-size: 3.5rem; }
  #placeholder p { font-size: 1rem; font-weight: 700; color: #aaa; }

  #sheet {
    height: 100%; max-width: 720px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 14px 10px 10px;
  }
  #sheet-title {
    text-align: center; font-weight: 900;
    font-size: clamp(1.3rem, 4.2vh, 2.1rem);
    letter-spacing: 0.06em; flex-shrink: 0; padding-bottom: 6px;
  }

  #board {
    flex: 1; position: relative; min-height: 0;
    display: grid;
    grid-template-columns: max-content 1fr max-content; /* widest card touches each edge; the middle gets the rest */
    grid-auto-rows: 1fr;

  #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  #lines .link {
    stroke: var(--accent); stroke-width: 4; stroke-linecap: round; fill: none;
    transition: stroke 0.35s;
  }
  #lines .link.good { stroke: var(--good); }
  #lines .link.bad  { stroke: var(--bad); }
  #lines .answer { stroke: var(--good); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; opacity: 0.9; }
  #lines .temp { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 1 8; stroke-linecap: round; }
  #lines .hit { stroke: transparent; stroke-width: 22; pointer-events: stroke; cursor: pointer; }
  #lines .mark * { fill: none; stroke-linecap: round; }
  #lines .mark .halo { stroke: var(--paper); stroke-width: 9; }
  #lines .mark circle.halo { fill: var(--paper); }
  #lines .mark .ink  { stroke-width: 4; }
  #lines .mark.good .ink { stroke: var(--good); }
  #lines .mark.bad  .ink { stroke: var(--bad); }

  /* ── NODES ── */
  /* each word is a card; left cards hug the left edge, right cards the right edge,
     so every dot lines up in two straight columns with a wide gap between */
  .node {
    position: relative; z-index: 2;
    align-self: center; min-height: 54px; box-sizing: border-box;
    display: flex; align-items: center; min-width: 0;
    background: var(--paper); color: inherit; font: inherit;
    border: 2.5px solid var(--ink); border-radius: 14px;
    cursor: pointer; padding: 5px 9px;
    font-size: 30px; /* JS sets one size for all words */
    transition: background 0.15s, border-color 0.2s, box-shadow 0.2s;
  }
  .node.L { grid-column: 1; justify-self: end; justify-content: flex-end; text-align: right; }
  .node.R { grid-column: 3; justify-self: start; justify-content: flex-start; text-align: left; }
  .node:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .label { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.3; overflow: hidden; }
  .node.L .label { align-items: flex-end; }
  .th { font-family: var(--thai); font-weight: 700; white-space: nowrap; font-size: 1.15em; /* Thai glyphs run small — this makes them match the Japanese */ padding: 0.12em 0; }
  .rd { font-size: 0.55em; font-weight: 700; white-space: nowrap; color: #333; margin-top: -0.15em; }
  .jp { font-size: 1em; font-weight: 700; white-space: nowrap; }

  .dot {
    flex-shrink: 0; width: 14px; height: 14px;
    border-radius: 50%; background: var(--ink);
    transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
  }
  .node.L .dot { margin-left: 7px; }
  .node.R .dot { margin-right: 7px; }
  .node.linked   { border-color: var(--accent); }
  .node.good     { border-color: var(--good); }
  .node.bad      { border-color: var(--bad); }
  @media (max-width: 600px) {
  }
  .node:hover .dot { transform: scale(1.25); }
  .node.linked .dot { background: var(--accent); }
  .node.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .node.selected .dot {
    background: var(--accent); transform: scale(1.45);
    box-shadow: 0 0 0 5px var(--accent-glow);
  }
  .node.good .dot { background: var(--good); }
  .node.bad  .dot { background: var(--bad); }
  .locked .node { cursor: default; }
  .locked .node:hover .dot { transform: none; }

  #sheet {  transition: padding-bottom 0.4s cubic-bezier(.2,.9,.3,1); }
  #sheet-foot {
    flex-shrink: 0; height: clamp(58px, 10vh, 84px); display: flex; align-items: flex-end;
    font-size: 0.75rem; font-weight: 700; color: #ccc;
  }

  /* ── CHECK BUTTON (➤) — appears once every word is linked ── */
  #check-btn {
    position: absolute; right: max(16px, calc(50% - 424px)); bottom: 14px; z-index: 6;
    width: clamp(52px, 8vh, 64px); height: clamp(52px, 8vh, 64px); border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 1.7rem; line-height: 1; padding-left: 5px;
    cursor: pointer;
    box-shadow: 0 6px 20px var(--accent-glow), 0 0 0 4px var(--paper);
    transform: scale(0); opacity: 0; pointer-events: none;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
  }
  #check-btn.show { transform: scale(1); opacity: 1; pointer-events: auto; }
  #check-btn:not(.ready) {
    background: var(--paper); color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--accent), 0 0 0 4px var(--paper);
  }
  #check-btn.ready { animation: pop 0.45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 50% { transform: scale(1.18); } }

  /* ── CONFIRM (checking before every word is linked) ── */
  #confirm {
    position: absolute; inset: 0; z-index: 8;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); padding: 20px;
  }
  #confirm.show { display: flex; }
  #confirm-box {
    width: min(340px, 100%); background: #0a0a0a; color: #fff;
    border: 2px solid var(--accent); border-radius: 16px;
    padding: 20px 18px 16px; text-align: center;
  }
  #confirm-box p { font-weight: 900; font-size: 1rem; line-height: 1.6; margin-bottom: 16px; }
  #confirm-box p small { display: block; font-size: 0.8rem; font-weight: 700; color: #999; }
  #confirm-box .actions { display: flex; gap: 8px; justify-content: center; }
  #check-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  /* ── RESULT PANEL ── */
  #result {
    position: absolute; left: 50%; bottom: 0; z-index: 7;
    width: min(880px, 100%);
    background: #0a0a0a; color: #fff;
    border-top: 3px solid var(--accent);
    border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    transform: translate(-50%, 110%);
    transition: transform 0.4s cubic-bezier(.2,.9,.3,1);
  }
  #result.show { transform: translate(-50%, 0); }
  #score { font-size: 2rem; font-weight: 900; line-height: 1; }
  #score small { font-size: 0.55em; color: #888; }
  #verdict { flex: 1; font-weight: 900; font-size: 1rem; min-width: 120px; }
  #result-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .res-btn {
    height: 40px; padding: 0 14px; border-radius: 10px;
    font-family: inherit; font-weight: 700; font-size: 0.85rem;
    border: 2px solid #333; background: #1a1a1a; color: #ddd; cursor: pointer;
  }
  .res-btn:hover { border-color: #666; color: #fff; }
  .res-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .res-btn[hidden] { display: none; }

  /* ── TITLE SCREEN ── */
  #title {
    position: fixed; inset: 0; z-index: 100; overflow: hidden;
    background: #fff;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 64dvh;
    transition: opacity 0.45s, visibility 0.45s;
  }

  /* back layer: same picture, heavily blurred, fills any empty edges on wide or tall screens */
  #title::before {
    content: ''; position: absolute; inset: -40px;
    background: var(--img) center / cover no-repeat;
    filter: blur(24px); opacity: 0.35;
  }
  /* main layer: the whole picture (title removed), soft lens blur, 75% opacity.
     It's a box with the picture's own shape, so the title can be placed on it in % */
  #title-art {                       /* JS sizes this to cover the whole screen */
    position: absolute; top: 0; left: 0; width: 100vw; aspect-ratio: 843 / 1264;
    container-type: inline-size;
  }
  #t-group { position: absolute; inset: 0; transform-origin: 0 0; }
  #title-art::before {
    content: ''; position: absolute; inset: 0;
    background: var(--img) center top / contain no-repeat;
    filter: blur(3px); opacity: 0.75;
  }
  /* the title, crisp, where it sat on the whiteboard — pops in like a sign */
  .t-line {
    position: absolute; margin: 0; white-space: nowrap;
    font-weight: 900; color: #1b2f6e; line-height: 1;
    transform: rotate(-9deg);
    -webkit-text-stroke: 0.6cqw #fff; paint-order: stroke fill;
    text-shadow: 0 1.2cqw 0 rgba(0,0,0,0.12);
    animation: pop-title 0.7s cubic-bezier(.34,1.56,.64,1) both;
  }
  .t-line::after {                                   /* marker stroke behind the words */
    content: ''; position: absolute; left: -2%; right: -4%; z-index: -1; border-radius: 99px;
  }
  #t1 { left: 13%; top: 3%;  font-size: 17cqw; }
  #t1::after { bottom: -18%; height: 26%; background: #f8d94a; transform: rotate(-4deg); }
  #t2 { left: 29%; top: 13.5%; font-size: 13.2cqw; animation-delay: 0.18s; }
  #t2::after { bottom: -14%; height: 11%; background: #f07a96; transform: rotate(-3deg); }
  @keyframes pop-title {
    0%   { opacity: 0; transform: rotate(-9deg) scale(0.4); }
    100% { opacity: 1; transform: rotate(-9deg) scale(1); }
  }
  #title.hide { opacity: 0; visibility: hidden; }
  #start-btn {
    position: relative; z-index: 1; font-family: inherit; font-weight: 900;
    font-size: 1.6rem; letter-spacing: 0.2em; padding: 16px 44px 16px calc(44px + 0.2em);
    color: #fff; background: #1a8c3a; border: 4px solid #fff; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 0 3px #1a8c3a;
    cursor: pointer; animation: breathe 2.2s ease-in-out infinite;
  }
  #start-btn:active { transform: scale(0.96); }
  @keyframes breathe { 50% { transform: scale(1.05); } }

  /* ── LEVEL SELECT ── */
  #setup {
    position: fixed; inset: 0; z-index: 90; overflow-y: auto;
    background: #f7f4ee; color: var(--ink);
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    transition: opacity 0.3s, visibility 0.3s;
  }
  #setup.hide { opacity: 0; visibility: hidden; }
  #setup-inner { max-width: 560px; margin: 0 auto; }
  #setup h2 { text-align: center; font-weight: 900; font-size: 1.5rem; letter-spacing: 0.06em; margin-bottom: 4px; }
  #setup .sub { text-align: center; font-weight: 700; font-size: 0.85rem; color: #999; margin-bottom: 18px; }
  .lvl { margin-bottom: 18px; }
  .lvl-name { font-weight: 900; font-size: 1rem; margin-bottom: 8px; color: var(--c); }
  .lvl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pick {
    font-family: inherit; font-weight: 900; font-size: 1.15rem;
    aspect-ratio: 1.25; border-radius: 14px; cursor: pointer;
    background: #fff; color: var(--ink); border: 3px solid var(--c);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform 0.12s, background 0.15s;
  }
  .pick:hover { transform: translateY(-2px); }
  .pick:active { transform: scale(0.95); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title">
  <div id="title-art">
    <div id="t-group">
      <h1 class="t-line" id="t1">タイ語</h1>
      <h1 class="t-line" id="t2">チャレンジ</h1>
    </div>
  </div>
  <button id="start-btn">スタート</button>
</div>

</div>

<div id="toolbar">
  <button class="tool-btn" id="undo-btn" disabled>↩ 戻す</button>
  <button class="tool-btn" id="clear-btn" disabled>🗑 クリア</button>
  <div id="pips" aria-hidden="true"></div>
  <div id="toolbar-spacer"></div>
</div>

<!-- WORKSHEET -->
<div id="stage">
  <div id="placeholder">
    <div class="emoji">🇹🇭</div>
    <p>レベルを選んで練習スタート！</p>
  </div>

  <div id="sheet">
    <h2 id="sheet-title"></h2>
    <div id="board">
      <svg id="lines" aria-hidden="true"></svg>
    </div>
    <div id="sheet-foot">by Kru Krit</div>
  </div>

  <button id="check-btn" aria-label="答え合わせ">➤</button>

  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-msg">
    <div id="confirm-box">
      <p id="confirm-msg"></p>
      <div class="actions">
        <button class="res-btn" id="confirm-no">つづける</button>
        <button class="res-btn primary" id="confirm-yes">答え合わせする</button>
      </div>
    </div>
  </div>

  <div id="result" role="status" aria-live="polite">
    <div id="score"></div>
    <div id="verdict"></div>
    <div id="result-actions">
      <button class="res-btn" id="answers-btn">正解を見る</button>
      <button class="res-btn" id="retry-btn">もう一度</button>
      <button class="res-btn primary" id="next-btn">次へ</button>
    </div>
  </div>
</div>

<script src="challenges.js"></script>
<script>
// ── THEME per level (green → yellow-green → yellow → orange → red) ────────
const THEMES = {
  1: { accent:'#1a8c3a', dark:'#0a3518', glow:'rgba(26,140,58,0.4)'  },
  2: { accent:'#5aaa20', dark:'#253d0a', glow:'rgba(90,170,32,0.4)'  },
  3: { accent:'#c8a800', dark:'#3d3200', glow:'rgba(200,168,0,0.4)'  },
  4: { accent:'#e85d26', dark:'#4a1a08', glow:'rgba(232,93,38,0.4)'  },
  5: { accent:'#d01820', dark:'#400508', glow:'rgba(208,24,32,0.4)'  },
};
function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent-dark', t.dark);
  r.setProperty('--accent-glow', t.glow);
  document.getElementById('theme-meta').setAttribute('content', t.accent);
}
applyTheme(THEMES[1]);

// ── ELEMENTS ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const select = $('level-select'), board = $('board'), svg = $('lines');
const placeholder = $('placeholder'), result = $('result'), checkBtn = $('check-btn');
const SVGNS = 'http://www.w3.org/2000/svg';
const KEYS = Object.keys(CHALLENGES);

// ── STATE ─────────────────────────────────────────────────────────────────
//   links[i] = index of the Japanese option linked to Thai word i (−1 = none)
let game = null;

function newGame(key) {
  const c = CHALLENGES[key];
  return {
    key, c,
    answer: c.words.map(w => c.right.indexOf(w[2])),
    links: c.words.map(() => -1),
    history: [],
    selected: null,       // a node element
    checked: false,
    showAnswers: false,
  };
}

// Warn authors about typos in challenges.js
for (const [k, c] of Object.entries(CHALLENGES)) {
  c.words.forEach(w => {
    const n = c.right.filter(r => r === w[2]).length;
    if (n !== 1) console.warn(`[${k}] answer "${w[2]}" for ${w[0]} appears ${n}× in right[]`);
  });
}

// ── RENDER ────────────────────────────────────────────────────────────────
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function load(key) {
  board.querySelectorAll('.node').forEach(n => n.remove());
  result.classList.remove('show');
  closeConfirm();
  $('sheet').style.paddingBottom = '';
  board.classList.remove('locked');

  if (!key) {
    game = null;
    placeholder.style.display = 'flex';
    applyTheme(THEMES[1]);
    refresh();
    showSetup();
    return;
  }

  game = newGame(key);
  placeholder.style.display = 'none';
  applyTheme(THEMES[key[0]] || THEMES[1]);
  $('sheet-title').textContent = `チャレンジ ${key} ${game.c.stars}`;

  game.c.words.forEach(([thai, reading], i) => {
    const b = el('button', 'node L');
    b.dataset.side = 'L'; b.dataset.i = i;
    b.style.gridRow = i + 1;
    const lab = el('span', 'label');
    lab.append(el('span', 'th', thai));
    if (reading) lab.append(el('span', 'rd', reading));
    b.append(lab, el('span', 'dot'));
    b.setAttribute('aria-label', reading ? `${thai} (${reading})` : thai);
    board.append(b);
  });
  game.c.right.forEach((jp, i) => {
    const b = el('button', 'node R');
    b.dataset.side = 'R'; b.dataset.i = i;
    b.style.gridRow = i + 1;
    const lab = el('span', 'label');
    lab.append(el('span', 'jp', jp));
    b.append(el('span', 'dot'), lab);
    board.append(b);
  });

  $('pips').replaceChildren(...game.c.words.map(() => el('span', 'pip')));
  fitText();
  refresh();
}

// Each card fits its own word exactly. Left cards end at the same line and
// right cards start at the same line, so the dots form two straight columns.
// The widest card on each side touches the edge; the middle gets the rest. One text size for the whole sheet;
// only a word too long for its column shrinks, on its own.
function fitText() {
  const nodes = [...board.querySelectorAll('.node')];
  if (!nodes.length) return;
  const W = board.clientWidth;
  const col = W * 0.36;                 // each side at most 36% → the middle keeps at least 28%
  const rowH = board.clientHeight / game.c.words.length;
  const size = Math.max(15, Math.min(21, rowH * 0.3));
  nodes.forEach(n => {
    n.style.width = 'max-content';
    let s = size;
    n.style.fontSize = s + 'px';
    // a long reading shrinks first (it's only a hint); the word itself keeps the sheet size
    const rd = n.querySelector('.rd');
    if (rd) { let r = 0.55; rd.style.fontSize = r + 'em';
              while (n.offsetWidth > col && r > 0.42) { r -= 0.01; rd.style.fontSize = r + 'em'; } }
    while (n.offsetWidth > col && s > 11) { s *= 0.95; n.style.fontSize = s + 'px'; }
  });
}

// ── STATE → SCREEN ────────────────────────────────────────────────────────
function nodeFor(side, i) { return board.querySelector(`.node[data-side="${side}"][data-i="${i}"]`); }

function refresh() {
  const g = game;
  const linked = g ? g.links.filter(r => r >= 0).length : 0;
  const total  = g ? g.links.length : 0;

  $('undo-btn').disabled  = !g || g.checked || !g.history.length;
  $('clear-btn').disabled = !g || g.checked || !linked;
  checkBtn.classList.toggle('show',  !!g && !g.checked && linked > 0);
  checkBtn.classList.toggle('ready', !!g && !g.checked && linked === total);

  if (!g) { svg.replaceChildren(); $('pips').replaceChildren(); return; }

  board.querySelectorAll('.node').forEach(n => n.classList.remove('linked', 'good', 'bad', 'selected'));
  g.links.forEach((r, l) => {
    if (r < 0) return;
    nodeFor('L', l).classList.add('linked');
    nodeFor('R', r).classList.add('linked');
    if (g.checked) nodeFor('L', l).classList.add(r === g.answer[l] ? 'good' : 'bad');
  });
  if (g.checked) g.links.forEach((r, l) => { if (r < 0) nodeFor('L', l).classList.add('bad'); });
  if (g.selected) g.selected.classList.add('selected');

  const pips = $('pips').children;
  g.links.forEach((r, l) => {
    pips[l].className = 'pip' + (!g.checked && r < 0 ? '' : r < 0 ? ' bad' : !g.checked ? ' on' : r === g.answer[l] ? ' good' : ' bad');
  });

  draw();
}

function dotCenter(node) {
  const d = node.querySelector('.dot').getBoundingClientRect();
  const b = board.getBoundingClientRect();
  return { x: d.left + d.width / 2 - b.left, y: d.top + d.height / 2 - b.top };
}

function line(a, b, cls) {
  const l = document.createElementNS(SVGNS, 'line');
  l.setAttribute('x1', a.x); l.setAttribute('y1', a.y);
  l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
  l.setAttribute('class', cls);
  return l;
}

let tempLine = null;

// ○ and × drawn as shapes, so they look the same on every device
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function markCircle(x, y) {
  const g = svgEl('g', { class: 'mark good' });
  g.append(svgEl('circle', { cx: x, cy: y, r: 9, class: 'halo' }),
           svgEl('circle', { cx: x, cy: y, r: 9, class: 'ink' }));
  return g;
}
function markCross(x, y) {
  const g = svgEl('g', { class: 'mark bad' }), d = 7.5;
  const p = `M${x-d},${y-d} L${x+d},${y+d} M${x+d},${y-d} L${x-d},${y+d}`;
  g.append(svgEl('path', { d: p, class: 'halo' }), svgEl('path', { d: p, class: 'ink' }));
  return g;
}

function draw() {
  const g = game;
  const parts = [];

  // dashed correct answers, drawn underneath wrong links
  if (g.checked && g.showAnswers) {
    g.answer.forEach((r, l) => {
      if (r >= 0 && g.links[l] !== r) parts.push(line(dotCenter(nodeFor('L', l)), dotCenter(nodeFor('R', r)), 'answer'));
    });
  }

  g.links.forEach((r, l) => {
    if (r < 0) return;
    const a = dotCenter(nodeFor('L', l)), b = dotCenter(nodeFor('R', r));
    const verdict = g.checked ? (r === g.answer[l] ? ' good' : ' bad') : '';
    parts.push(line(a, b, 'link' + verdict));
    if (!g.checked) {
      const hit = line(a, b, 'hit');
      hit.addEventListener('click', () => unlink(l));
      parts.push(hit);
    }
  });

  // ○ / × marks, like a teacher's red pen — placed near the Thai side of each line
  if (g.checked) {
    g.links.forEach((r, l) => {
      const a = dotCenter(nodeFor('L', l));
      if (r < 0) { parts.push(markCross(a.x + 26, a.y)); return; } // left blank
      const b = dotCenter(nodeFor('R', r));
      const ok = r === g.answer[l];
      const x = a.x + (b.x - a.x) * 0.16, y = a.y + (b.y - a.y) * 0.16;
      parts.push(ok ? markCircle(x, y) : markCross(x, y));
    });
  }

  if (tempLine) parts.push(tempLine);
  svg.replaceChildren(...parts);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function remember() {
  game.history.push(game.links.slice());
  if (game.history.length > 50) game.history.shift();
}

function link(a, b) {
  const [L, R] = a.dataset.side === 'L' ? [a, b] : [b, a];
  const l = +L.dataset.i, r = +R.dataset.i;
  if (game.links[l] === r) return;
  remember();
  game.links = game.links.map(x => (x === r ? -1 : x)); // one line per option
  game.links[l] = r;
}

function unlink(l) {
  if (game.checked) return;
  remember();
  game.links[l] = -1;
  game.selected = null;
  refresh();
}

function tap(node) {
  const s = game.selected;
  if (!s)                                    game.selected = node;
  else if (s === node)                       game.selected = null;
  else if (s.dataset.side === node.dataset.side) game.selected = node;
  else { link(s, node);                      game.selected = null; }
  refresh();
}

// ── POINTER: tap-tap or drag, both work ──────────────────────────────────
let drag = null;

board.addEventListener('pointerdown', e => {
  const node = e.target.closest('.node');
  if (!node || !game || game.checked) return;
  e.preventDefault();
  drag = { node, id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
  board.setPointerCapture(e.pointerId);
});

board.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true;
    game.selected = drag.node;
    refresh();
  }
  if (drag.moved) {
    const b = board.getBoundingClientRect();
    tempLine = line(dotCenter(drag.node), { x: e.clientX - b.left, y: e.clientY - b.top }, 'temp');
    draw();
  }
});

function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; tempLine = null;
  if (board.hasPointerCapture(e.pointerId)) board.releasePointerCapture(e.pointerId);
  if (cancelled) { game.selected = null; refresh(); return; }

  if (!d.moved) return tap(d.node);
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node');
  if (target && target.dataset.side !== d.node.dataset.side) link(d.node, target);
  game.selected = null;
  refresh();
}
board.addEventListener('pointerup',     e => endDrag(e, false));
board.addEventListener('pointercancel', e => endDrag(e, true));

// keyboard: Tab to a word, Enter/Space to pick it (pointer taps are handled above)
board.addEventListener('click', e => {
  const node = e.target.closest('.node');
  if (node && e.detail === 0 && game && !game.checked) tap(node);
});

// ── TOOLBAR ───────────────────────────────────────────────────────────────
$('undo-btn').addEventListener('click', undo);
function undo() {
  if (!game || game.checked || !game.history.length) return;
  game.links = game.history.pop();
  game.selected = null;
  refresh();
}
$('clear-btn').addEventListener('click', () => {
  if (!game || game.checked) return;
  remember();
  game.links = game.links.map(() => -1);
  game.selected = null;
  refresh();
});

// ── CHECK ─────────────────────────────────────────────────────────────────
checkBtn.addEventListener('click', () => {
  const left = game.links.filter(r => r < 0).length;
  if (!left) return grade();
  $('confirm-msg').innerHTML =
    `まだ ${left} つ つないでいません。<br>このまま答え合わせしますか？<small>つないでいない問題は × になります</small>`;
  $('confirm').classList.add('show');
  $('confirm-no').focus();
});
function closeConfirm() { $('confirm').classList.remove('show'); }
$('confirm-no').addEventListener('click', closeConfirm);
$('confirm-yes').addEventListener('click', () => { closeConfirm(); grade(); });
$('confirm').addEventListener('click', e => { if (e.target.id === 'confirm') closeConfirm(); });

function grade() {
  game.checked = true;
  game.selected = null;
  board.classList.add('locked');
  refresh();

  const total = game.links.length;
  const score = game.links.filter((r, l) => r === game.answer[l]).length;
  $('score').innerHTML = `${score}<small> / ${total}</small>`;
  $('verdict').textContent =
    score === total      ? '全問正解！🎉' :
    score >= total - 2   ? 'あと少し！' :
                           'もう一度チャレンジしてみよう！';
  $('answers-btn').hidden = score === total;
  $('answers-btn').textContent = '正解を見る';
  const next = KEYS[KEYS.indexOf(game.key) + 1];
  $('next-btn').hidden = !next;
  $('next-btn').classList.toggle('primary', score === total);
  $('retry-btn').classList.toggle('primary', score !== total);
  result.classList.add('show');
  const room = result.offsetHeight + 8 - $('sheet-foot').offsetHeight;
  $('sheet').style.paddingBottom = Math.max(10, room) + 'px';
}

$('answers-btn').addEventListener('click', () => {
  game.showAnswers = !game.showAnswers;
  $('answers-btn').textContent = game.showAnswers ? '正解をかくす' : '正解を見る';
  draw();
});
$('retry-btn').addEventListener('click', () => load(game.key));
$('next-btn').addEventListener('click', () => {
  const next = KEYS[KEYS.indexOf(game.key) + 1];
  if (next) { select.value = next; load(next); }
});

// ── LEVEL SELECT, RESIZE, SHORTCUTS ───────────────────────────────────────
select.addEventListener('change', e => load(e.target.value));

new ResizeObserver(() => { if (game) { fitText(); draw(); } }).observe(board);
document.fonts?.ready.then(() => { if (game) { fitText(); draw(); } });

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Escape' && $('confirm').classList.contains('show')) return closeConfirm();
  if (e.key === 'Escape' && game && game.selected) { game.selected = null; refresh(); }
});

// ── SCREENS: title → level select → challenge ────────────────────────────
const LEVEL_NAMES = { 1: '★ レベル1', 2: '★★ レベル2', 3: '★★★ レベル3', 4: '😮 レベル4', 5: '🤯 レベル5' };

function showSetup() {
  const wrap = $('levels');
  wrap.replaceChildren();
  for (const lvl of [...new Set(KEYS.map(k => k[0]))]) {
    const sec = el('div', 'lvl');
    sec.style.setProperty('--c', (THEMES[lvl] || THEMES[1]).accent);
    sec.append(el('div', 'lvl-name', LEVEL_NAMES[lvl] || `レベル${lvl}`));
    const grid = el('div', 'lvl-grid');
    KEYS.filter(k => k[0] === lvl).forEach(k => {
      const b = el('button', 'pick', k);
      b.addEventListener('click', () => openChallenge(k));
      grid.append(b);
    });
    sec.append(grid);
    wrap.append(sec);
  }
  $('setup').classList.remove('hide');
}

function openChallenge(k) {
  $('setup').classList.add('hide');
  select.value = k;
  load(k);
}

// Title picture fills the whole screen (no empty band). If the screen is narrower
// than the picture, the title is scaled/shifted just enough to stay fully visible.
function layoutTitle() {
  const W = innerWidth, H = innerHeight;
  // phones (portrait): cover the screen. Wide screens: whole picture, blurred copy fills the sides
  const s = W / H > 0.8 ? H / 1264 : Math.max(W / 843, H / 1264), bw = 843 * s;
  const left = (W - bw) / 2;
  const art = $('title-art');
  Object.assign(art.style, { left: left + 'px', width: bw + 'px' });
  const T0 = 0.11, T1 = 0.97;                        // title spans 11%–97% of the picture width
  const span = (T1 - T0) * bw, room = W - 24;
  const k = Math.min(1, room / span);
  const x0 = Math.max(12, Math.min(left + T0 * bw, W - 12 - span * k));
  const tx = x0 - left - T0 * bw * k;
  $('t-group').style.transform = `translate(${tx}px, 0) scale(${k})`;
}
layoutTitle();
addEventListener('resize', layoutTitle);

$('start-btn').addEventListener('click', () => { $('title').classList.add('hide'); showSetup(); });

// ?c=2b opens a challenge directly (skips the title — handy for sharing a link)
const startKey = new URLSearchParams(location.search).get('c');
if (startKey && CHALLENGES[startKey]) { $('title').classList.add('hide'); openChallenge(startKey); }
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
